<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrimsonPulse — Red &amp; Black Community Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Orbitron:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #070305;
      --bg-glass: rgba(16, 6, 9, 0.76);
      --bg-glass-strong: rgba(22, 7, 11, 0.88);
      --border-red: rgba(220, 38, 38, 0.28);
      --border-red-strong: rgba(239, 68, 68, 0.62);
      --accent: #dc2626;
      --accent-soft: rgba(220, 38, 38, 0.22);
      --text-main: #f6ecef;
      --text-muted: #a69499;
      --font-sans: 'Plus Jakarta Sans', 'Hind Siliguri', 'Anek Bangla', 'Apple Color Emoji', system-ui, -apple-system, 'Segoe UI', 'Noto Sans Bengali', sans-serif;
      --font-display: 'Orbitron', 'Rajdhani', 'Anek Bangla', system-ui, sans-serif;
      --font-serif-bn: 'Noto Serif Bengali', 'Hind Siliguri', Georgia, serif;
    }

    .ios-emoji {
      display: inline-block;
      width: 1.36em;
      height: 1.36em;
      vertical-align: -0.26em;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.68)) drop-shadow(0 0 8px rgba(220, 38, 38, 0.16));
      transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .rx-btn:hover .ios-emoji { transform: scale(1.22); }
    .emoji-picker-wrap { position: relative; display: inline-block; }
    .emoji-picker-pop {
      position: absolute;
      bottom: 46px;
      left: 0;
      z-index: 55;
      width: 274px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .emoji-pick-btn {
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms ease, transform 150ms ease;
    }
    .emoji-pick-btn:hover { background: rgba(220, 38, 38, 0.28); transform: scale(1.12); }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: var(--font-sans);
      background-color: var(--bg-void);
      background-image:
        radial-gradient(ellipse 75% 50% at 15% 10%, rgba(153, 27, 27, 0.22), transparent 60%),
        radial-gradient(ellipse 60% 45% at 88% 85%, rgba(127, 29, 29, 0.18), transparent 60%),
        radial-gradient(circle at 50% 45%, rgba(69, 10, 10, 0.14), transparent 70%);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button { cursor: pointer; border: none; background: none; }

    .hidden { display: none !important; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .font-display { font-family: var(--font-display); }
    .font-serif-bn { font-family: var(--font-serif-bn); }

    .glass {
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-red);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.58), 0 0 22px rgba(185, 28, 28, 0.08);
      border-radius: 16px;
    }

    .glass-hover {
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), border-color 180ms ease, box-shadow 180ms ease;
    }
    .glass-hover:hover {
      border-color: rgba(239, 68, 68, 0.45);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.68), 0 0 26px rgba(220, 38, 38, 0.16);
    }

    .c-input {
      width: 100%;
      background: rgba(10, 4, 6, 0.8);
      border: 1px solid rgba(220, 38, 38, 0.26);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      color: #f8eff1;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .c-input:focus {
      outline: none;
      border-color: var(--border-red-strong);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.18);
    }

    .c-btn {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      border: 1px solid rgba(248, 113, 113, 0.38);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(185, 28, 28, 0.34);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: transform 150ms cubic-bezier(0.16, 1, 0.3, 1), filter 150ms ease;
    }
    .c-btn:hover:not(:disabled) { filter: brightness(1.1); }
    .c-btn:active:not(:disabled) { transform: scale(0.98); }
    .c-btn:disabled { opacity: 0.72; cursor: not-allowed; }
    .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.32);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: cp-spin 0.6s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes cp-spin {
      to { transform: rotate(360deg); }
    }

    .c-btn-ghost {
      background: rgba(10, 4, 6, 0.65);
      border: 1px solid rgba(220, 38, 38, 0.28);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #e6d8dc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      text-decoration: none;
      transition: border-color 150ms ease, background 150ms ease;
    }
    .c-btn-ghost:hover {
      border-color: var(--border-red-strong);
      background: rgba(127, 29, 29, 0.25);
    }

    /* Auth Layout */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(127, 29, 29, 0.45);
      border-radius: 12px;
      margin: 18px 0;
    }
    .auth-tab {
      padding: 9px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .auth-tab.active {
      background: rgba(220, 38, 38, 0.9);
      color: #ffffff;
    }

    /* App Shell */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .brand span { color: #ef4444; }

    .desktop-nav {
      display: none;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }
    .nav-btn {
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #d1c4c8;
      white-space: nowrap;
      transition: background 150ms ease, color 150ms ease;
    }
    .nav-btn:hover { background: rgba(127, 29, 29, 0.3); color: #ffffff; }
    .nav-btn.active { background: rgba(220, 38, 38, 0.9); color: #ffffff; }

    .main-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 88px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }
    .sidebar { display: none; }

    @media (min-width: 1024px) {
      .desktop-nav { display: flex; }
      .mobile-bottom-nav { display: none !important; }
      .main-grid {
        grid-template-columns: 280px 1fr;
        padding-bottom: 40px;
      }
      .sidebar { display: block; position: sticky; top: 76px; }
    }

    /* Mobile Bottom Bar */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
      overflow-x: auto;
    }
    .mob-btn {
      min-width: 52px;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      padding: 4px 6px;
    }
    .mob-btn.active { color: #f87171; }

    /* Cards & Media */
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .card { padding: 18px; }
    .avatar-sm { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(239, 68, 68, 0.45); background: #000; }
    .avatar-xs { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(239, 68, 68, 0.4); background: #000; }

    .reactions-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid rgba(127, 29, 29, 0.4);
    }
    .rx-btn {
      min-height: 40px;
      border-radius: 11px;
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(127, 29, 29, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #d6c8cc;
    }
    .rx-btn.active {
      background: rgba(220, 38, 38, 0.25);
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(220, 38, 38, 0.28);
    }

    /* Profile Reference Structure */
    .profile-card { overflow: hidden; }
    .profile-cover {
      position: relative;
      height: 190px;
      background: #050203;
    }
    .profile-cover img { width: 100%; height: 100%; object-fit: cover; }
    .profile-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(7,3,5,0.88), transparent 60%);
    }
    .profile-body { padding: 0 20px 20px; }
    .profile-avatar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-top: -52px;
      position: relative;
      z-index: 2;
    }
    .profile-avatar-lg {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      border: 4px solid #0a0406;
      object-fit: cover;
      background: #000;
      box-shadow: 0 0 22px rgba(220, 38, 38, 0.35);
    }

    /* Group Chat */
    .chat-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .chat-list-col { display: flex; flex-direction: column; gap: 8px; }
    .chat-panel-col { display: none; overflow: hidden; }
    .chat-layout.has-active .chat-list-col { display: none; }
    .chat-layout.has-active .chat-panel-col { display: block; }
    .mob-back-btn { display: inline-flex; }
    @media (min-width: 768px) {
      .chat-layout { grid-template-columns: 270px 1fr; }
      .chat-list-col, .chat-layout.has-active .chat-list-col { display: flex !important; }
      .chat-panel-col, .chat-layout.has-active .chat-panel-col { display: block !important; }
      .mob-back-btn { display: none !important; }
    }
    .typing-dots { display: inline-flex; gap: 3px; align-items: center; }
    .typing-dots span {
      width: 5px; height: 5px; border-radius: 50%; background: #f87171;
      animation: cp-bounce 1s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes cp-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    .chat-messages {
      height: 360px;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 13px;
      word-break: break-word;
    }
    .bubble.mine {
      align-self: flex-end;
      background: rgba(185, 28, 28, 0.78);
      border: 1px solid rgba(248, 113, 113, 0.4);
    }
    .bubble.other {
      align-self: flex-start;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(127, 29, 29, 0.5);
    }
    .admin-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 9px;
      font-weight: 700;
      background: rgba(220, 38, 38, 0.28);
      border: 1px solid rgba(248, 113, 113, 0.5);
      color: #fecaca;
      line-height: 1.4;
      white-space: nowrap;
    }
    .reply-quote-box {
      display: block;
      width: 100%;
      text-align: left;
      padding: 6px 8px;
      margin-bottom: 6px;
      border-radius: 8px;
      border-left: 2px solid #f87171;
      background: rgba(0, 0, 0, 0.35);
      font-size: 11px;
      cursor: pointer;
    }
    .reply-quote-box:hover {
      background: rgba(0, 0, 0, 0.52);
    }
    .msg-highlight {
      box-shadow: 0 0 0 2px #f87171, 0 0 18px rgba(239, 68, 68, 0.5) !important;
    }
    .reply-bar {
      padding: 7px 12px;
      border-top: 1px solid rgba(127, 29, 29, 0.45);
      background: rgba(127, 29, 29, 0.22);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }

    /* Grids */
    .market-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .market-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .shatru-3grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .shatru-slot {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 1px dashed rgba(239, 68, 68, 0.45);
      background: rgba(0, 0, 0, 0.52);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }
    .shatru-slot img { width: 100%; height: 100%; object-fit: cover; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 500px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
    }

    .err-banner {
      background: rgba(127, 29, 29, 0.48);
      border: 1px solid rgba(239, 68, 68, 0.55);
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 12px;
      color: #fecaca;
    }
    .ok-banner {
      background: rgba(6, 78, 59, 0.45);
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 12px;
      color: #a7f3d0;
    }
  </style>
</head>
<body>
  <!-- AUTH VIEW -->
  <div id="auth-view" class="auth-wrap">
    <div class="glass auth-card">
      <div style="text-align:center;">
        <div class="brand" style="font-size:22px;">CRIMSON<span>PULSE</span></div>
        <p id="auth-subtitle" style="font-size:13px;color:var(--text-muted);margin-top:6px;">
          CoreSync Vault-এ আপনার অ্যাকাউন্টে প্রবেশ করুন
        </p>
      </div>

      <div class="auth-tabs">
        <button type="button" id="tab-login-btn" class="auth-tab active">লগইন</button>
        <button type="button" id="tab-reg-btn" class="auth-tab">রেজিস্টার</button>
      </div>

      <div id="auth-error" class="err-banner hidden" style="margin-bottom:12px;"></div>

      <form id="auth-form" autocomplete="off" class="stack" style="gap:12px;">
        <div id="reg-name-wrap" class="hidden">
          <label style="display:block;font-size:12px;margin-bottom:4px;color:#d6c8cc;">নাম / ইউজারনেম</label>
          <input type="text" id="auth-name" class="c-input" placeholder="আপনার নাম লিখুন" autocomplete="off" />
        </div>
        <div>
          <label style="display:block;font-size:12px;margin-bottom:4px;color:#d6c8cc;">ইমেইল অ্যাড্রেস</label>
          <input type="email" id="auth-email" class="c-input" placeholder="you@domain.com" autocomplete="off" required />
        </div>
        <div>
          <label style="display:block;font-size:12px;margin-bottom:4px;color:#d6c8cc;">পাসওয়ার্ড</label>
          <input type="password" id="auth-password" class="c-input" placeholder="পাসওয়ার্ড লিখুন" autocomplete="new-password" required />
        </div>
        <div id="reg-bio-wrap" class="hidden">
          <label style="display:block;font-size:12px;margin-bottom:4px;color:#d6c8cc;">বায়ো (ঐচ্ছিক)</label>
          <input type="text" id="auth-bio" class="c-input" placeholder="সংক্ষিপ্ত পরিচিতি" autocomplete="off" />
        </div>
        <button type="submit" id="auth-submit-btn" class="c-btn" style="width:100%;padding:12px;">
          ভল্টে প্রবেশ করুন
        </button>
      </form>

      <div style="margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,29,29,0.4);text-align:center;font-size:11px;color:var(--text-muted);">
        CoreSync Vault · MediaGrid CDN · হালকা Tor-রেডি কমিউনিটি
      </div>
    </div>
  </div>

  <!-- MAIN APP SHELL -->
  <div id="app-shell" class="hidden">
    <header class="glass topbar">
      <div class="topbar-inner">
        <button type="button" class="brand" data-nav="feed">CRIMSON<span>PULSE</span></button>
        <nav class="desktop-nav" id="desktop-nav"></nav>
        <button type="button" id="logout-btn" class="c-btn-ghost">লগআউট</button>
      </div>
    </header>

    <main class="main-grid">
      <aside class="sidebar" id="sidebar-profile"></aside>
      <section id="view-container" class="stack"></section>
    </main>

    <nav class="glass mobile-bottom-nav" id="mobile-nav"></nav>
  </div>

  <!-- MODAL ROOT -->
  <div id="modal-root" class="modal-backdrop hidden"></div>

      function relTime(ts) {

        if (mins < 60) return mins + ' মি. আগে';

      }

      // Pure-JS SHA-256 for Tor HTTP (.onion) compatibility
      function sha256(ascii) {
        function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
        const maxWord = Math.pow(2, 32);
        const words = [];
        const utf8 = unescape(encodeURIComponent(ascii));
        const len = utf8.length;
        const hash = [];
        const k = [];
        let pc = 0;
        const comp = {};
        for (let c = 2; pc < 64; c++) {
          if (!comp[c]) {
            for (let i = 0; i < 313; i += c) comp[i] = true;
            hash[pc] = (Math.pow(c, 0.5) * maxWord) | 0;
            k[pc++] = (Math.pow(c, 1 / 3) * maxWord) | 0;
          }
        }
        let msg = utf8 + '\x80';
        while ((msg.length % 64) - 56) msg += '\x00';
        for (let i = 0; i < msg.length; i++) {
          const j = msg.charCodeAt(i);
          words[i >> 2] |= j << (((3 - i) % 4) * 8);
        }
        const bl = len * 8;
        words[words.length] = (bl / maxWord) | 0;
        words[words.length] = bl | 0;
        for (let j = 0; j < words.length;) {
          const w = words.slice(j, (j += 16));
          const old = hash.slice(0);
          for (let i = 0; i < 64; i++) {
            const w15 = w[i - 15], w2 = w[i - 2];
            const a = hash[0], e = hash[4];
            const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
              (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
            const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
            hash.unshift((t1 + t2) | 0);
            hash[4] = (hash[4] + t1) | 0;
            hash.pop();
          }
          for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
        }
        let res = '';
        for (let i = 0; i < 8; i++) {
          for (let j = 3; j >= 0; j--) {
            const b = (hash[i] >> (j * 8)) & 255;
            res += (b < 16 ? '0' : '') + b.toString(16);
          }
        }
        return res;
      }

      async function compressImageIfNeeded(file) {
        if (!file || !file.type || !file.type.startsWith('image/') || file.type === 'image/gif' || file.size <= 1.5 * 1024 * 1024) {
          return file;
        }
        try {
          const url = URL.createObjectURL(file);
          const img = await new Promise((resolve, reject) => {
            const el = new Image();
            el.onload = () => resolve(el);
            el.onerror = () => reject(new Error('Image decode failed'));
            el.src = url;
          });
          URL.revokeObjectURL(url);
          const maxDim = 1920;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          if (!ctx) return file;
          ctx.drawImage(img, 0, 0, w, h);
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.86));
          if (blob && blob.size > 0 && blob.size < file.size) {
            const base = (file.name || 'photo').replace(/\.[^.]+$/, '');
            return new File([blob], base + '.jpg', { type: 'image/jpeg' });
          }
        } catch (e) {}
        return file;
      }

      function sendXhrMedia(endpoint, file, timeoutMs, onProgress) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', endpoint, true);
          xhr.timeout = timeoutMs;
          xhr.upload.onprogress = function (ev) {
            if (ev.lengthComputable && onProgress) {
              const pct = Math.min(99, Math.max(1, Math.round((ev.loaded / ev.total) * 100)));
              onProgress(pct);
            }
          };
          xhr.onload = function () {
            let data = null;
            try { data = JSON.parse(xhr.responseText); } catch (e) {}
            if (xhr.status >= 200 && xhr.status < 300 && data && data.secure_url) {
              if (onProgress) onProgress(100);
              resolve(data.secure_url);
            } else {
              const msg = (data && data.error && data.error.message) ? data.error.message : ('Status ' + xhr.status);
              reject(new Error(msg));
            }
          };
          xhr.onerror = function () { reject(new Error('নেটওয়ার্ক সমস্যার কারণে মিডিয়া আপলোড হয়নি।')); };
          xhr.ontimeout = function () { reject(new Error('আপলোড টাইমআউট হয়েছে, ফাইলের সাইজ ছোট করে আবার চেষ্টা করুন।')); };
          const fd = new FormData();
          fd.append('file', file);
          fd.append('upload_preset', MEDIAGRID_PRESET);
          xhr.send(fd);
        });
      }

      async function uploadMedia(file, type, onProgress) {
        if (!file || file.size === 0) throw new Error('ফাইলটি খালি বা নষ্ট, অন্য ফাইল সিলেক্ট করুন।');
        const kind = type || 'auto';
        const prepared = kind === 'image' ? await compressImageIfNeeded(file) : file;
        const timeoutMs = kind === 'video' ? 240000 : 90000;
        const primary = 'https://api.cloudinary.com/v1_1/' + MEDIAGRID_CLOUD + '/' + kind + '/upload';
        try {
          return await sendXhrMedia(primary, prepared, timeoutMs, onProgress);
        } catch (err) {
          if (kind !== 'auto') {
            try {
              const autoEp = 'https://api.cloudinary.com/v1_1/' + MEDIAGRID_CLOUD + '/auto/upload';
              return await sendXhrMedia(autoEp, prepared, timeoutMs, onProgress);
            } catch (err2) {
              throw new Error('মিডিয়া আপলোড ব্যর্থ হয়েছে: ' + ((err2 && err2.message) || 'MediaGrid error'));
            }

          throw new Error('মিডিয়া আপলোড ব্যর্থ হয়েছে: ' + ((err && err.message) || 'MediaGrid error'));
        }
      }

      function withTimeout(promise, ms) {
        return Promise.race([
          promise,
          new Promise((_, reject) => setTimeout(() => reject(new Error('সার্ভার রেসপন্স করতে দেরি হচ্ছে, আবার চেষ্টা করুন।')), ms))
        ]);
      }

      let transportInFlight = null;
      let authHydrated = false;

      function waitForInitialAuthHydration() {
        if (authHydrated || auth.currentUser) {
          authHydrated = true;
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          let doneFlag = false;
          const finish = () => {
            if (doneFlag) return;
            doneFlag = true;
            authHydrated = true;
            resolve();
          };
          const tm = setTimeout(finish, 2500);
          const unsub = auth.onAuthStateChanged(() => {
            clearTimeout(tm);
            try { unsub(); } catch (e) {}
            finish();
          });
        });
      }

      async function ensureTransport() {
        if (auth.currentUser) {
          try { await withTimeout(auth.currentUser.getIdToken(), 8000); } catch (e) {}
          return;
        }
        if (transportInFlight) return transportInFlight;
        transportInFlight = (async () => {
          try {
            await waitForInitialAuthHydration();
            if (!auth.currentUser) {
              try {
                await withTimeout(auth.signInAnonymously(), 15000);
              } catch (e1) {
                try {
                  await withTimeout(auth.signInAnonymously(), 15000);
                } catch (e2) {}
              }
            }
            if (auth.currentUser) {
              try { await withTimeout(auth.currentUser.getIdToken(), 8000); } catch (e) {}
            }
          } finally {
            transportInFlight = null;
          }
        })();
        return transportInFlight;
      }

          ? 'CoreSync Vault-এ আপনার অ্যাকাউন্টে প্রবেশ করুন'
          : 'নতুন কমিউনিটি অ্যাকাউন্ট তৈরি করুন';
        authErr.classList.add('hidden');
      }

      document.getElementById('tab-login-btn').onclick = () => setAuthMode('login');
      document.getElementById('tab-reg-btn').onclick = () => setAuthMode('register');

      function showAuthError(msg) {
        authErr.textContent = msg;
        authErr.classList.remove('hidden');
      }

      authForm.onsubmit = async function (e) {
        e.preventDefault();
        authErr.classList.add('hidden');
        const email = document.getElementById('auth-email').value.trim().toLowerCase();
        const password = document.getElementById('auth-password').value;
        const name = document.getElementById('auth-name').value.trim();
        const bio = document.getElementById('auth-bio').value.trim();
        const btn = document.getElementById('auth-submit-btn');

        if (!email || !password) return showAuthError('ইমেইল এবং পাসওয়ার্ড দিন।');

        btn.disabled = true;
        btn.innerHTML = '<span class="btn-spinner"></span><span>' +
          (state.authMode === 'login' ? 'লগইন হচ্ছে...' : 'অ্যাকাউন্ট তৈরি হচ্ছে...') + '</span>';

        try {
          if (state.authMode === 'login') {
            // Special Admin Login (fast path)
            if (email === ADMIN_EMAIL && password === ADMIN_PASS) {
              let adminUid = 'admin_root';
              try {
                const c = await withTimeout(auth.signInWithEmailAndPassword(email, password), 15000);
                adminUid = c.user.uid;
              } catch (e1) {
                try {
                  const c2 = await withTimeout(auth.createUserWithEmailAndPassword(email, password), 15000);
                  adminUid = c2.user.uid;
                } catch (e2) {
                  await ensureTransport();
                  if (auth.currentUser) adminUid = auth.currentUser.uid;
                }
              }
              const adminProfile = {
                uid: adminUid,
                name: 'Root Administrator',
                handle: 'root_admin',
                email: ADMIN_EMAIL,
                bio: 'কমিউনিটি অ্যাডমিনিস্ট্রেটর',
                avatar: DEFAULT_AVATAR,
                cover: DEFAULT_COVER,
                role: 'admin',
                banned: false,
                passHash: sha256(ADMIN_PASS),
                createdAt: Date.now()
              };
              db.ref('users/' + adminUid).once('value').then((snap) => {
                if (snap.exists()) {
                  db.ref('users/' + adminUid).update({ role: 'admin', banned: false, passHash: sha256(ADMIN_PASS) }).catch(() => {});
                } else {
                  db.ref('users/' + adminUid).set(adminProfile).catch(() => {});
                }
              }).catch(() => {});
              enterApp(adminProfile, 'admin');
              return;
            }

            // Standard User Fast Login
            let uid = null;
            try {
              const cred = await withTimeout(auth.signInWithEmailAndPassword(email, password), 15000);
              uid = cred.user.uid;
            } catch (err) {
              await ensureTransport();
            }

            if (uid) {
              const snap = await withTimeout(db.ref('users/' + uid).once('value'), 10000).catch(() => null);
              if (snap && snap.exists()) {
                const p = snap.val();
                if (p.banned) return showAuthError('আপনার অ্যাকাউন্টটি অ্যাডমিন কর্তৃক ব্যান করা হয়েছে।');
                return enterApp({ ...p, uid: p.uid || uid }, p.role === 'admin' ? 'admin' : 'feed');
              }
              // Auth succeeded but RTDB profile missing — create cleanly and enter immediately
              const fallbackProfile = {
                uid: uid,
                name: email.split('@')[0],
                handle: email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 16) || 'member',
                email: email,
                bio: 'CrimsonPulse কমিউনিটির সদস্য',
                avatar: DEFAULT_AVATAR,
                cover: DEFAULT_COVER,
                role: 'user',
                banned: false,
                passHash: sha256(password),
                createdAt: Date.now()
              };
              db.ref('users/' + uid).set(fallbackProfile).catch(() => {});
              return enterApp(fallbackProfile, 'feed');
            }

            // Fallback indexed email lookup (for admin-reset DB password or disabled Email provider)
            const matched = await findUserByEmail(email);
            const hash = sha256(password);
            if (!matched) return showAuthError('ইমেইল বা পাসওয়ার্ড সঠিক নয়।');
            if (matched.banned) return showAuthError('আপনার অ্যাকাউন্টটি অ্যাডমিন কর্তৃক ব্যান করা হয়েছে।');
            if (matched.passHash && matched.passHash !== hash) return showAuthError('পাসওয়ার্ড সঠিক নয়।');
            enterApp(matched, matched.role === 'admin' ? 'admin' : 'feed');
          } else {
            // Fast Register
            if (!name) return showAuthError('আপনার নাম লিখুন।');
            if (password.length < 6) return showAuthError('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।');
            if (email === ADMIN_EMAIL) return showAuthError('এই ইমেইলটি সংরক্ষিত।');

            let uid = '';
            try {
              const cred = await withTimeout(auth.createUserWithEmailAndPassword(email, password), 15000);
              uid = cred.user.uid;
            } catch (err) {
              if (err && err.code === 'auth/email-already-in-use') {
                return showAuthError('এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট তৈরি করা হয়েছে।');
              }
              await ensureTransport();
              uid = 'usr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            }

            const handle = (name.toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 16)) || ('member_' + Math.floor(1000 + Math.random() * 9000));
            const newProfile = {
              uid: uid,
              name: name,
              handle: handle,
              email: email,
              bio: bio || 'CrimsonPulse কমিউনিটির সদস্য',
              avatar: DEFAULT_AVATAR,
              cover: DEFAULT_COVER,
              role: 'user',
              banned: false,
              passHash: sha256(password),
              createdAt: Date.now()
            };
            await withTimeout(db.ref('users/' + uid).set(newProfile), 12000);
            enterApp(newProfile, 'feed');
          }
        } catch (err) {
          showAuthError((err && err.message) ? err.message : 'সংযোগ ব্যর্থ হয়েছে।');
        } finally {
          btn.disabled = false;
          btn.textContent = state.authMode === 'login' ? 'ভল্টে প্রবেশ করুন' : 'অ্যাকাউন্ট তৈরি করুন';
        }
      };

      // =========================================================================
      // 4. REALTIME LISTENERS & APP ENTRY
      // =========================================================================
      let streamHandlers = [];
      let boundTransportUid = null;

      function detachStreams() {
        streamHandlers.forEach((h) => {
          try { h.ref.off('value', h.cb); } catch (e) {}
        });
        streamHandlers = [];
        boundTransportUid = null;
      }

      async function processPendingInvite() {
        try {
          const raw = localStorage.getItem('cp_tor_pending_invite');
          if (!raw || !state.currentUser) return;
          const parsed = JSON.parse(raw);
          localStorage.removeItem('cp_tor_pending_invite');
          if (!parsed || !parsed.groupId) return;
          await ensureTransport();
          const gSnap = await db.ref('groups/' + parsed.groupId).once('value');
          if (gSnap.exists()) {
            const gVal = gSnap.val() || {};
            if (!gVal.inviteCode || !parsed.code || gVal.inviteCode === parsed.code) {
              await db.ref('groups/' + parsed.groupId + '/members/' + state.currentUser.uid).set(true);
              state.activeTab = 'groups';
              saveActiveTab('groups');
              selectGroup(parsed.groupId);
            }
          }
          if (window.location.search.indexOf('joinGroup=') !== -1 && window.history && window.history.replaceState) {
            window.history.replaceState({}, '', window.location.pathname + window.location.hash);
          }
        } catch (e) {}
      }

      function enterApp(profile, targetTab) {
        state.currentUser = profile;
        state.viewingProfileUid = profile.uid;
        state.activeTab = targetTab || 'feed';
        saveSession(profile.uid, profile);
        saveActiveTab(state.activeTab);
        authView.classList.add('hidden');
        appShell.classList.remove('hidden');
        bindStreams(false);
        renderAll();
        processPendingInvite();
      }

      let renderQueued = false;
      function scheduleRender() {
        // Never disrupt user while uploading or typing in active inputs
        if (state.isUploading) return;
        const ae = document.activeElement;
        if (ae && (
          ae.id === 'group-msg-input' || ae.id === 'cg-search' || ae.id === 'gm-search' ||
          ae.id === 'feed-text' || ae.id === 'mk-title' || ae.id === 'mk-tg' ||
          ae.id === 'mk-desc' || ae.id === 'mk-search' || ae.id === 'shatru-caption'
        )) {
          if (state.activeTab === 'groups' && state.selectedGroupId) {
            refreshChatStreamDom();
          }
          return;
        }
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderQueued = false;
          renderAll();
        });
      }

      async function bindStreams(forceRebind) {
        await ensureTransport();
        if (!state.currentUser) return;
        const tUid = (auth.currentUser && auth.currentUser.uid) ? auth.currentUser.uid : 'anon_pending';
        if (!forceRebind && streamHandlers.length > 0 && boundTransportUid === tUid) return;

        detachStreams();
        boundTransportUid = tUid;

        const addStream = (path, onData) => {
          const r = db.ref(path);
          const cb = r.on('value', onData, (err) => {
            if (err && state.currentUser) {
              boundTransportUid = null;
            }
          });
          streamHandlers.push({ ref: r, cb: cb });
        };

        addStream('users', (snap) => {
          const raw = snap.val() || {};
          const norm = {};
          Object.keys(raw).forEach((k) => { norm[k] = { ...raw[k], uid: raw[k].uid || k }; });
          state.users = norm;
          if (state.currentUser && norm[state.currentUser.uid]) {
            if (norm[state.currentUser.uid].banned) {
              logout();
              return;
            }
            state.currentUser = norm[state.currentUser.uid];
            saveSession(state.currentUser.uid, state.currentUser);
          }
          scheduleRender();
        });

        addStream('posts', (snap) => {
          const raw = snap.val() || {};
          state.posts = Object.keys(raw).map((id) => ({ id, ...raw[id] })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          scheduleRender();
        });

        addStream('groups', (snap) => {
          const raw = snap.val() || {};
          state.groups = Object.keys(raw).map((id) => ({ id, ...raw[id] })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          scheduleRender();
        });

        addStream('marketplace', (snap) => {
          const raw = snap.val() || {};
          state.marketplace = Object.keys(raw).map((id) => ({ id, ...raw[id] })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          scheduleRender();
        });

        addStream('shatru_data', (snap) => {
          const raw = snap.val() || {};
          state.shatru = Object.keys(raw).map((id) => ({ id, ...raw[id] })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          scheduleRender();
        });

        addStream('friends', (snap) => {
          state.friends = snap.val() || {};
          scheduleRender();
        });

        addStream('friend_requests', (snap) => {
          state.requests = snap.val() || {};
          scheduleRender();
        });
      }

      function logout() {
        detachStreams();
        clearSession();
        state.currentUser = null;
        appShell.classList.add('hidden');
        authView.classList.remove('hidden');
        document.getElementById('auth-email').value = '';
        document.getElementById('auth-password').value = '';
        auth.signOut().catch(() => {});
      }

      document.getElementById('logout-btn').onclick = logout;
      // Session hydration executes at the end of the script after all handlers are ready.

      // 5. NAVIGATION & RENDERING

          : state.posts.map((p) => {

      function buildGroupMessagesHtml() {

        if (state.groupMessages.length === 0) {
          return '<div style="text-align:center;color:var(--text-muted);font-size:12px;padding:30px;">এখনো কোনো মেসেজ নেই। কথোপকথন শুরু করুন।</div>';
        }
        const activeGrp = state.groups.find((g) => g.id === state.selectedGroupId);
        const latestId = state.groupMessages[state.groupMessages.length - 1].id;
        const seenList = Object.entries(state.groupSeen || {})
          .filter(([uid, sv]) => uid !== u.uid && sv && sv.lastSeenMsgId === latestId)
          .map(([, sv]) => sv);

        return state.groupMessages.map((m, idx) => {
          const mine = m.senderUid === u.uid;
          const s = state.users[m.senderUid] || {};
          const isLast = idx === state.groupMessages.length - 1;
          const isSenderGrpAdmin = Boolean(
            activeGrp && ((activeGrp.admins && activeGrp.admins[m.senderUid]) || activeGrp.createdBy === m.senderUid)
          );
          let mediaHtml = '';
          if (m.mediaUrl && m.mediaType === 'image') {
            mediaHtml = '<div style="margin-bottom:6px;border-radius:10px;overflow:hidden;border:1px solid rgba(239,68,68,0.35);background:#000;"><img src="' + esc(m.mediaUrl) + '" style="max-width:100%;max-height:260px;object-fit:contain;display:block;" loading="lazy" /></div>';
          } else if (m.mediaUrl && m.mediaType === 'video') {

      function buildTypingHtml() {
        const u = state.currentUser;

        return '<div class="typing-dots"><span></span><span></span><span></span></div><span>' + esc(text) + '</span>';

        const pFriends = Object.keys(state.friends[p.uid] || {});
        const myIncoming = Object.keys(state.requests[me.uid] || {});

        const isFr = Boolean(state.friends[me.uid] && state.friends[me.uid][p.uid]);
        const sent = Boolean(state.requests[p.uid] && state.requests[p.uid][me.uid]);
        const inc = Boolean(state.requests[me.uid] && state.requests[me.uid][p.uid]);

        let actionHtml = '';
        if (isOwn) {
          actionHtml = '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +

          '</div>';
        } else if (isFr) {
          actionHtml = '<button type="button" class="c-btn-ghost" data-unfriend="' + esc(p.uid) + '">ফ্রেন্ড আছেন · আনফ্রেন্ড</button>';

          actionHtml = '<div style="display:flex;gap:8px;">' +
            '<button type="button" class="c-btn" data-accept-req="' + esc(p.uid) + '">অ্যাকসেপ্ট</button>' +

      function renderAll() {
        if (!state.currentUser) return;
        const validTabs = ['feed', 'groups', 'marketplace', 'shatru', 'others', 'profile', 'admin'];
        if (!validTabs.includes(state.activeTab) || (state.activeTab === 'admin' && state.currentUser.role !== 'admin')) {
          state.activeTab = 'feed';
          saveActiveTab('feed');
        }
        const container = document.getElementById('view-container');
        try {
          renderNav();
          renderSidebar();
          if (state.activeTab === 'feed') container.innerHTML = renderFeed();
          else if (state.activeTab === 'groups') container.innerHTML = renderGroups();
          else if (state.activeTab === 'marketplace') container.innerHTML = renderMarketplace();
          else if (state.activeTab === 'shatru') container.innerHTML = renderShatru();
          else if (state.activeTab === 'others') container.innerHTML = renderOthers();
          else if (state.activeTab === 'profile') container.innerHTML = renderProfile();
          else if (state.activeTab === 'admin') container.innerHTML = renderAdmin();
          else container.innerHTML = renderFeed();
          bindDynamicHandlers();
        } catch (err) {
          if (container) {
            container.innerHTML = '<div class="glass card err-banner">রেন্ডার ত্রুটি: ' + esc((err && err.message) ? err.message : 'দয়া করে পেজ রিফ্রেশ করুন।') + '</div>';
          }
        }
      }

      // =========================================================================
      // 6. EVENT DELEGATION & DYNAMIC FORM HANDLERS
      // =========================================================================

      function markLatestSeen(groupId) {
        if (!groupId || !state.currentUser || !state.groupMessages.length) return;
        const latest = state.groupMessages[state.groupMessages.length - 1];
        const cur = state.groupSeen && state.groupSeen[state.currentUser.uid];
        if (cur && cur.lastSeenMsgId === latest.id) return;
        db.ref('group_seen/' + groupId + '/' + state.currentUser.uid).set({
          name: state.currentUser.name,
          lastSeenMsgId: latest.id,
          ts: Date.now()
        }).catch(() => {});
      }

      async function selectGroup(groupId) {
        state.selectedGroupId = groupId;
        state.groupMessages = [];
        state.groupTyping = {};
        state.groupSeen = {};
        state.groupError = '';
        state.replyingTo = null;
        pendingChatFile = null;
        pendingChatKind = null;
        renderAll();

        await ensureTransport();
        if (groupMsgRefActive) groupMsgRefActive.off();
        if (groupTypingRefActive) groupTypingRefActive.off();
        if (groupSeenRefActive) groupSeenRefActive.off();

        groupMsgRefActive = db.ref('group_messages/' + groupId);
        groupMsgRefActive.on('value', (snap) => {
          const raw = snap.val() || {};
          state.groupMessages = Object.keys(raw).map((id) => ({ id, ...raw[id] })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          refreshChatStreamDom();
          markLatestSeen(groupId);
        }, (err) => {
          state.groupError = 'মেসেজ লোড সমস্যা: ' + (err && err.message ? err.message : 'Permission denied');
          renderAll();
        });

        groupTypingRefActive = db.ref('group_typing/' + groupId);
        groupTypingRefActive.on('value', (snap) => {
          state.groupTyping = snap.val() || {};
          refreshChatStreamDom();
        });

        groupSeenRefActive = db.ref('group_seen/' + groupId);
        groupSeenRefActive.on('value', (snap) => {
          state.groupSeen = snap.val() || {};
          refreshChatStreamDom();
        });
      }

      function getGroupInviteUrl(grp) {
        const code = grp.inviteCode || 'open';
        return window.location.origin + window.location.pathname + '?joinGroup=' + encodeURIComponent(grp.id) + '&code=' + encodeURIComponent(code);
      }

      async function copyTextSafe(txt) {
        try {
          await navigator.clipboard.writeText(txt);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = txt;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
      }

      function bindDynamicHandlers() {
        // Feed form
        const fImg = document.getElementById('feed-img');
        const fVid = document.getElementById('feed-vid');
        const fPrev = document.getElementById('feed-preview');
        const fClr = document.getElementById('clear-feed-media');
        const clearFeedSelection = () => {
          pendingFeedFile = null;
          pendingFeedKind = null;
          if (fImg) fImg.value = '';
          if (fVid) fVid.value = '';
          if (fPrev) { fPrev.innerHTML = ''; fPrev.classList.add('hidden'); }
        };
        if (fClr) fClr.onclick = clearFeedSelection;
        const showFeedSelection = () => {
          if (!fPrev || !pendingFeedFile) return;
          fPrev.innerHTML = '<span>নির্বাচিত (' + (pendingFeedKind === 'video' ? 'ভিডিও' : 'ছবি') + '): ' + esc(pendingFeedFile.name) + '</span>' +
            '<button type="button" id="clear-feed-media" class="c-btn-ghost" style="padding:3px 8px;">✕</button>';
          fPrev.style.display = 'flex';
          fPrev.style.alignItems = 'center';
          fPrev.style.justifyContent = 'space-between';
          fPrev.style.gap = '8px';
          fPrev.classList.remove('hidden');
          const cBtn = document.getElementById('clear-feed-media');
          if (cBtn) cBtn.onclick = clearFeedSelection;
        };
        if (fImg) fImg.onchange = (e) => {
          pendingFeedFile = e.target.files[0] || null;
          pendingFeedKind = pendingFeedFile ? 'image' : null;
          if (fVid) fVid.value = '';
          showFeedSelection();
        };
        if (fVid) fVid.onchange = (e) => {
          pendingFeedFile = e.target.files[0] || null;
          pendingFeedKind = pendingFeedFile ? 'video' : null;
          if (fImg) fImg.value = '';
          showFeedSelection();
        };
        const feedForm = document.getElementById('feed-form');
        if (feedForm) feedForm.onsubmit = async (e) => {
          e.preventDefault();
          const txtEl = document.getElementById('feed-text');
          const txt = txtEl ? txtEl.value.trim() : '';
          const errEl = document.getElementById('feed-err');
          if (errEl) errEl.classList.add('hidden');
          if (!txt && !pendingFeedFile) return;
          const btn = document.getElementById('feed-submit');
          state.isUploading = true;
          btn.disabled = true;
          btn.textContent = 'আপলোড হচ্ছে...';
          try {
            await ensureTransport();
            let mediaUrl = '';
            let mediaType = 'none';
            if (pendingFeedFile) {
              mediaUrl = await uploadMedia(pendingFeedFile, pendingFeedKind, (pct) => {
                btn.textContent = 'আপলোড হচ্ছে... ' + pct + '%';
              });
              mediaType = pendingFeedKind;
            }
            btn.textContent = 'পোস্ট সেভ হচ্ছে...';
            const postObj = {
              authorUid: state.currentUser.uid,
              text: txt,
              mediaType: mediaType,
              mediaUrl: mediaUrl,
              createdAt: Date.now()
            };
            const postRef = db.ref('posts').push();
            await withTimeout(postRef.set(postObj), 15000);
            state.posts = [{ id: postRef.key, ...postObj }, ...state.posts.filter((x) => x.id !== postRef.key)];
            pendingFeedFile = null;
            pendingFeedKind = null;
            if (txtEl) txtEl.value = '';
            state.isUploading = false;
            renderAll();
          } catch (err) {
            if (errEl) {
              errEl.textContent = formatVaultError(err, 'পোস্ট করা যায়নি।');
              errEl.classList.remove('hidden');
            }
          } finally {
            state.isUploading = false;
            const b = document.getElementById('feed-submit');
            if (b) { b.disabled = false; b.textContent = 'পোস্ট করুন'; }
          }
        };

        // Group chat
        const gBtn = document.getElementById('open-create-group');
        if (gBtn) gBtn.onclick = openCreateGroupModal;
        const gMemBtn = document.getElementById('open-group-members');
        if (gMemBtn) gMemBtn.onclick = () => openGroupManageModal();
        const gSet = document.getElementById('open-group-settings');
        if (gSet) gSet.onclick = () => openGroupManageModal();
        const gBack = document.getElementById('back-to-groups-btn');
        if (gBack) gBack.onclick = () => {
          state.selectedGroupId = null;
          state.replyingTo = null;
          renderAll();
        };
        const gCopyQuick = document.getElementById('copy-group-invite-quick');
        if (gCopyQuick) gCopyQuick.onclick = async () => {
          const g = state.groups.find((x) => x.id === state.selectedGroupId);
          if (!g) return;
          if (!g.inviteCode) {
            const code = genInviteCode();
            g.inviteCode = code;
            db.ref('groups/' + g.id).update({ inviteCode: code }).catch(() => {});
          }
          await copyTextSafe(getGroupInviteUrl(g));
          state.copiedInvite = true;
          renderAll();
          setTimeout(() => { state.copiedInvite = false; renderAll(); }, 2200);
        };
        const cImgIn = document.getElementById('chat-img-in');
        if (cImgIn) cImgIn.onchange = (e) => {
          pendingChatFile = e.target.files[0] || null;
          pendingChatKind = pendingChatFile ? 'image' : null;
          renderAll();
        };
        const cVidIn = document.getElementById('chat-vid-in');
        if (cVidIn) cVidIn.onchange = (e) => {
          pendingChatFile = e.target.files[0] || null;
          pendingChatKind = pendingChatFile ? 'video' : null;
          renderAll();
        };
        const cClrMedia = document.getElementById('clear-chat-media');
        if (cClrMedia) cClrMedia.onclick = () => {
          pendingChatFile = null;
          pendingChatKind = null;
          renderAll();
        };
        const gInput = document.getElementById('group-msg-input');
        if (gInput) gInput.oninput = () => {
          if (!state.selectedGroupId) return;
          const tRef = db.ref('group_typing/' + state.selectedGroupId + '/' + state.currentUser.uid);
          if (!gInput.value.trim()) { tRef.remove().catch(() => {}); return; }
          const now = Date.now();
          if (now - lastTypingSentTs > 1400) {
            lastTypingSentTs = now;
            tRef.set({ name: state.currentUser.name, ts: now }).catch(() => {});
          }
          if (typingStopTimer) clearTimeout(typingStopTimer);
          typingStopTimer = setTimeout(() => { tRef.remove().catch(() => {}); }, 3200);
        };
        const gForm = document.getElementById('group-msg-form');
        if (gForm) gForm.onsubmit = async (e) => {
          e.preventDefault();
          const inp = document.getElementById('group-msg-input');
          const txt = inp ? inp.value.trim() : '';
          if ((!txt && !pendingChatFile) || !state.selectedGroupId) return;
          const sendBtn = document.getElementById('group-msg-send');
          state.isUploading = true;
          if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = '<span class="btn-spinner"></span>'; }
          state.groupError = '';
          try {
            await ensureTransport();
            let mediaUrl = '';
            let mediaType = 'none';
            if (pendingChatFile && pendingChatKind) {
              mediaUrl = await uploadMedia(pendingChatFile, pendingChatKind, (pct) => {
                if (sendBtn) sendBtn.textContent = pct + '%';
              });
              mediaType = pendingChatKind;
            }
            const payload = {
              senderUid: state.currentUser.uid,
              text: txt,
              mediaType: mediaType,
              mediaUrl: mediaUrl,
              createdAt: Date.now()
            };
            if (state.replyingTo) {
              payload.replyTo = {
                id: state.replyingTo.id,
                senderUid: state.replyingTo.senderUid,
                senderName: state.replyingTo.senderName,
                text: state.replyingTo.text,
                mediaType: state.replyingTo.mediaType || 'none'
              };
            }
            await withTimeout(db.ref('group_messages/' + state.selectedGroupId).push(payload), 15000);
            if (inp) inp.value = '';
            pendingChatFile = null;
            pendingChatKind = null;
            state.replyingTo = null;
            db.ref('group_typing/' + state.selectedGroupId + '/' + state.currentUser.uid).remove().catch(() => {});
            state.isUploading = false;
            renderAll();
          } catch (err) {
            state.groupError = 'মেসেজ পাঠানো যায়নি: ' + formatVaultError(err, 'ত্রুটি হয়েছে');
            state.isUploading = false;
            renderAll();
          } finally {
            state.isUploading = false;
            const b = document.getElementById('group-msg-send');
            if (b) { b.disabled = false; b.textContent = 'পাঠান'; }
          }
        };

        // Marketplace
        const mkToggle = document.getElementById('toggle-market-form');
        if (mkToggle) mkToggle.onclick = () => document.getElementById('market-form').classList.toggle('hidden');
        const mkImgInput = document.getElementById('mk-img');
        if (mkImgInput) mkImgInput.onchange = (e) => {
          const fn = document.getElementById('mk-file-name');
          const f = e.target.files[0];
          if (fn) {
            if (f) { fn.textContent = 'নির্বাচিত ছবি: ' + f.name; fn.classList.remove('hidden'); }
            else { fn.textContent = ''; fn.classList.add('hidden'); }
          }
        };
        const mkSearch = document.getElementById('mk-search');
        if (mkSearch) mkSearch.oninput = (e) => {
          state.marketSearch = e.target.value;
          const wrap = document.getElementById('market-cards-wrap');
          if (wrap) wrap.innerHTML = buildMarketCardsHtml();
        };
        const mkForm = document.getElementById('market-form');
        if (mkForm) mkForm.onsubmit = async (e) => {
          e.preventDefault();
          const title = document.getElementById('mk-title').value.trim();
          let tg = document.getElementById('mk-tg').value.trim();
          const desc = document.getElementById('mk-desc').value.trim();
          const file = document.getElementById('mk-img').files[0];
          const mkErr = document.getElementById('mk-err');
          if (mkErr) mkErr.classList.add('hidden');
          if (!title || !tg || !desc || !file) return;
          if (!tg.startsWith('@')) tg = '@' + tg;
          const btn = document.getElementById('mk-submit');
          state.isUploading = true;
          btn.disabled = true;
          btn.textContent = 'আপলোড হচ্ছে...';
          try {
            await ensureTransport();
            const imageUrl = await uploadMedia(file, 'image', (pct) => {
              btn.textContent = 'আপলোড হচ্ছে... ' + pct + '%';
            });
            const mkObj = {
              sellerUid: state.currentUser.uid,
              title: title,
              description: desc,
              telegram: tg,
              imageUrl: imageUrl,
              createdAt: Date.now()
            };
            const mkRef = db.ref('marketplace').push();
            await withTimeout(mkRef.set(mkObj), 15000);
            state.marketplace = [{ id: mkRef.key, ...mkObj }, ...state.marketplace.filter((x) => x.id !== mkRef.key)];
            state.isUploading = false;
            renderAll();
          } catch (err) {
            if (mkErr) {
              mkErr.textContent = formatVaultError(err, 'মার্কেটপ্লেস পোস্ট ব্যর্থ হয়েছে।');
              mkErr.classList.remove('hidden');
            }
          } finally {
            state.isUploading = false;
            const b = document.getElementById('mk-submit');
            if (b) { b.disabled = false; b.textContent = 'মার্কেটপ্লেসে পোস্ট করুন'; }
          }
        };

        // Shatru Data (3 images)
        const shFiles = document.getElementById('shatru-files');
        if (shFiles) shFiles.onchange = (e) => {
          pendingShatruFiles = Array.from(e.target.files || []).slice(0, 3);
          const grid = document.getElementById('shatru-preview-grid');
          if (grid) {
            grid.innerHTML = [0, 1, 2].map((i) => {
              const f = pendingShatruFiles[i];
              return f
                ? '<div class="shatru-slot"><img src="' + URL.createObjectURL(f) + '" /></div>'
                : '<div class="shatru-slot">ছবি ' + (i + 1) + '</div>';
            }).join('');
          }
        };
        const shForm = document.getElementById('shatru-form');
        if (shForm) shForm.onsubmit = async (e) => {
          e.preventDefault();
          const cap = document.getElementById('shatru-caption').value.trim();
          const errBox = document.getElementById('shatru-err');
          if (errBox) errBox.classList.add('hidden');
          if (pendingShatruFiles.length < 3 || !cap) {
            if (errBox) {
              errBox.textContent = 'অবশ্যই একসাথে ৩টি ছবি ও ক্যাপশন দিন।';
              errBox.classList.remove('hidden');
            }
            return;
          }
          const btn = document.getElementById('shatru-submit');
          state.isUploading = true;
          btn.disabled = true;
          btn.textContent = '৩টি ছবি আপলোড হচ্ছে...';
          try {
            await ensureTransport();
            const urls = await Promise.all(pendingShatruFiles.map((f) => uploadMedia(f, 'image')));
            const shObj = {
              authorUid: state.currentUser.uid,
              caption: cap,
              images: urls,
              createdAt: Date.now()
            };
            const shRef = db.ref('shatru_data').push();
            await withTimeout(shRef.set(shObj), 15000);
            state.shatru = [{ id: shRef.key, ...shObj }, ...state.shatru.filter((x) => x.id !== shRef.key)];
            pendingShatruFiles = [];
            state.isUploading = false;
            renderAll();
          } catch (err) {
            if (errBox) {
              errBox.textContent = formatVaultError(err, 'আপলোড ব্যর্থ হয়েছে।');
              errBox.classList.remove('hidden');
            }
          } finally {
            state.isUploading = false;
            const b = document.getElementById('shatru-submit');
            if (b) { b.disabled = false; b.textContent = '৩টি ছবিসহ পোস্ট করুন'; }
          }
        };

        // Profile avatar / cover / bio
        const showProfErr = (msg) => {
          const pe = document.getElementById('prof-err');
          if (pe) { pe.textContent = msg; pe.classList.remove('hidden'); }
        };
        const upAv = document.getElementById('up-avatar');
        if (upAv) upAv.onchange = async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const pe = document.getElementById('prof-err');
          if (pe) pe.classList.add('hidden');
          try {
            await ensureTransport();
            const url = await uploadMedia(f, 'image');
            await withTimeout(db.ref('users/' + state.currentUser.uid).update({ avatar: url }), 15000);
            state.currentUser = { ...state.currentUser, avatar: url };
            state.users[state.currentUser.uid] = state.currentUser;
            saveSession(state.currentUser.uid, state.currentUser);
            renderAll();
          } catch (err) {
            showProfErr(formatVaultError(err, 'প্রোফাইল ছবি আপলোড ব্যর্থ হয়েছে।'));
          }
        };
        const upCov = document.getElementById('up-cover');
        if (upCov) upCov.onchange = async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const pe = document.getElementById('prof-err');
          if (pe) pe.classList.add('hidden');
          try {
            await ensureTransport();
            const url = await uploadMedia(f, 'image');
            await withTimeout(db.ref('users/' + state.currentUser.uid).update({ cover: url }), 15000);
            state.currentUser = { ...state.currentUser, cover: url };
            state.users[state.currentUser.uid] = state.currentUser;
            saveSession(state.currentUser.uid, state.currentUser);
            renderAll();
          } catch (err) {
            showProfErr(formatVaultError(err, 'কভার ফটো আপলোড ব্যর্থ হয়েছে।'));
          }
        };
        const edProf = document.getElementById('open-edit-profile');
        if (edProf) edProf.onclick = openEditProfileModal;

        // Admin Password Form
        const admPw = document.getElementById('admin-pw-form');
        if (admPw) admPw.onsubmit = async (e) => {
          e.preventDefault();
          const uid = document.getElementById('adm-pw-uid').value;
          const pw = document.getElementById('adm-pw-val').value;
          const msg = document.getElementById('adm-pw-msg');
          if (!uid || pw.length < 6) {
            msg.innerHTML = '<div class="err-banner">ইউজার ও কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।</div>';
            return;
          }
          await db.ref('users/' + uid).update({ passHash: sha256(pw), passwordUpdatedByAdminAt: Date.now() });
          msg.innerHTML = '<div class="ok-banner">CoreSync Vault-এ পাসওয়ার্ড আপডেট করা হয়েছে।</div>';
        };
        const admPwEmail = document.getElementById('adm-pw-email');
        if (admPwEmail) admPwEmail.onclick = async () => {
          const uid = document.getElementById('adm-pw-uid').value;
          const u = state.users[uid];
          const msg = document.getElementById('adm-pw-msg');
          if (!u || !u.email) return;
          try {
            await auth.sendPasswordResetEmail(u.email);
            msg.innerHTML = '<div class="ok-banner">রিসেট ইমেইল পাঠানো হয়েছে।</div>';
          } catch (err) {
            msg.innerHTML = '<div class="err-banner">' + esc(err.message) + '</div>';
          }
        };
      }

      // Global click delegation
      document.addEventListener('click', async function (e) {
        const epTgl = e.target.closest('.toggle-ep');
        if (epTgl) {
          const pop = document.getElementById('ep-pop-' + epTgl.getAttribute('data-ep-target'));
          if (pop) pop.classList.toggle('hidden');
          return;
        }
        const epPick = e.target.closest('[data-ep-pick]');
        if (epPick) {
          const tid = epPick.getAttribute('data-ep-pick');
          const em = epPick.getAttribute('data-em');
          const inp = document.getElementById(tid);
          if (inp && em) { inp.value += em; inp.focus(); }
          const pop = document.getElementById('ep-pop-' + tid);
          if (pop) pop.classList.add('hidden');
          return;
        }
        const nav = e.target.closest('[data-nav]');
        if (nav) {
          const tab = nav.getAttribute('data-nav');
          if (tab === 'profile') state.viewingProfileUid = state.currentUser.uid;
          state.activeTab = tab;
          saveActiveTab(tab);
          renderAll();
          return;
        }
        const prof = e.target.closest('[data-profile]');
        if (prof) {
          closeModal();
          state.viewingProfileUid = prof.getAttribute('data-profile');
          state.profileSubTab = 'posts';
          state.activeTab = 'profile';
          saveActiveTab('profile');
          renderAll();
          return;
        }
        const repBtn = e.target.closest('[data-reply-msg]');
        if (repBtn) {
          const mid = repBtn.getAttribute('data-reply-msg');
          const m = state.groupMessages.find((x) => x.id === mid);
          if (m) {
            const su = state.users[m.senderUid] || {};
            state.replyingTo = {
              id: m.id,
              senderUid: m.senderUid,
              senderName: su.name || 'সদস্য',
              text: m.text || (m.mediaType === 'image' ? '📷 ছবি' : m.mediaType === 'video' ? '🎬 ভিডিও' : ''),
              mediaType: m.mediaType || 'none'
            };
            const bar = document.getElementById('chat-reply-bar');
            if (bar) {
              bar.classList.remove('hidden');
              bar.innerHTML =
                '<div style="min-width:0;flex:1;">' +
                  '<div style="font-size:11px;font-weight:700;color:#fca5a5;">↩ রিপ্লাই দিচ্ছেন: ' + esc(state.replyingTo.senderName) + '</div>' +
                  '<div style="font-size:11px;color:#e5d8dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(state.replyingTo.text) + '</div>' +
                '</div>' +
                '<button type="button" id="clear-reply-btn" class="c-btn-ghost" style="padding:4px 8px;">✕</button>';
            }
            const inp = document.getElementById('group-msg-input');
            if (inp) inp.focus();
          }
          return;
        }
        if (e.target.closest('#clear-reply-btn')) {
          state.replyingTo = null;
          const bar = document.getElementById('chat-reply-bar');
          if (bar) bar.classList.add('hidden');
          return;
        }
        const jumpBtn = e.target.closest('[data-jump-msg]');
        if (jumpBtn) {
          const targetId = jumpBtn.getAttribute('data-jump-msg');
          const el = document.getElementById('gmsg-' + targetId);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const bub = el.querySelector('.bubble');
            if (bub) {
              bub.classList.add('msg-highlight');
              setTimeout(() => bub.classList.remove('msg-highlight'), 1800);
            }
          }
          return;
        }
        const ptab = e.target.closest('[data-ptab]');
        if (ptab) {
          state.profileSubTab = ptab.getAttribute('data-ptab');
          renderAll();
          return;
        }
        const rx = e.target.closest('[data-react]');
        if (rx) {
          const [pid, key] = rx.getAttribute('data-react').split(':');
          const post = state.posts.find((x) => x.id === pid);
          const cur = post && post.reactions ? post.reactions[state.currentUser.uid] : null;
          const pRef = db.ref('posts/' + pid + '/reactions/' + state.currentUser.uid);
          if (cur === key) await pRef.remove();
          else await pRef.set(key);
          return;
        }
        const delPost = e.target.closest('[data-del-post]');
        if (delPost) { await db.ref('posts/' + delPost.getAttribute('data-del-post')).remove(); return; }
        const delMarket = e.target.closest('[data-del-market]');
        if (delMarket) { await db.ref('marketplace/' + delMarket.getAttribute('data-del-market')).remove(); return; }
        const delShatru = e.target.closest('[data-del-shatru]');
        if (delShatru) { await db.ref('shatru_data/' + delShatru.getAttribute('data-del-shatru')).remove(); return; }
        const selGrp = e.target.closest('[data-select-group]');
        if (selGrp) { selectGroup(selGrp.getAttribute('data-select-group')); return; }

        // Friend requests
        const sReq = e.target.closest('[data-send-req]');
        if (sReq) { await db.ref('friend_requests/' + sReq.getAttribute('data-send-req') + '/' + state.currentUser.uid).set(true); return; }
        const cReq = e.target.closest('[data-cancel-req]');
        if (cReq) { await db.ref('friend_requests/' + cReq.getAttribute('data-cancel-req') + '/' + state.currentUser.uid).remove(); return; }
        const aReq = e.target.closest('[data-accept-req]');
        if (aReq) {
          const sid = aReq.getAttribute('data-accept-req');
          await db.ref('friends/' + state.currentUser.uid + '/' + sid).set(true);
          await db.ref('friends/' + sid + '/' + state.currentUser.uid).set(true);
          await db.ref('friend_requests/' + state.currentUser.uid + '/' + sid).remove();
          return;
        }
        const dReq = e.target.closest('[data-decline-req]');
        if (dReq) { await db.ref('friend_requests/' + state.currentUser.uid + '/' + dReq.getAttribute('data-decline-req')).remove(); return; }
        const uFr = e.target.closest('[data-unfriend]');
        if (uFr) {
          const tid = uFr.getAttribute('data-unfriend');
          await db.ref('friends/' + state.currentUser.uid + '/' + tid).remove();
          await db.ref('friends/' + tid + '/' + state.currentUser.uid).remove();
          return;
        }

        // Admin
        const aTab = e.target.closest('[data-atab]');
        if (aTab) { state.adminSubTab = aTab.getAttribute('data-atab'); renderAll(); return; }
        const aCat = e.target.closest('[data-acat]');
        if (aCat) { state.adminPostCat = aCat.getAttribute('data-acat'); renderAll(); return; }
        const banU = e.target.closest('[data-ban-user]');
        if (banU) {
          const uid = banU.getAttribute('data-ban-user');
          const u = state.users[uid];
          if (u) await db.ref('users/' + uid).update({ banned: !u.banned });
          return;
        }
        const delU = e.target.closest('[data-del-user]');
        if (delU) { await db.ref('users/' + delU.getAttribute('data-del-user')).remove(); return; }
      });

      // =========================================================================
      // 7. MODALS (Create Group, Manage Group, Edit Profile)
      // =========================================================================

      function openEditProfileModal() {

            '<input type="text" id="ep-name" class="c-input" value="' + esc(u.name) + '" required />' +

            '</div>' +
          '</form>';

        document.getElementById('close-modal-btn').onclick = closeModal;

          });
