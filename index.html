      function openCreateGroupModal() {
        const others = Object.values(state.users).filter((x) => x.uid !== state.currentUser.uid && !x.banned);
        const picked = {};

        function renderPickList(q) {
          const term = (q || '').trim().toLowerCase();
          const filtered = others.filter((o) =>
            !term ||
            (o.name && o.name.toLowerCase().includes(term)) ||
            (o.handle && o.handle.toLowerCase().includes(term)) ||
            (o.email && o.email.toLowerCase().includes(term))
          );
          const listEl = document.getElementById('cg-user-list');
          if (!listEl) return;
          listEl.innerHTML = filtered.length === 0
            ? '<div style="font-size:12px;color:var(--text-muted);padding:6px;">কোনো মেম্বার পাওয়া যায়নি।</div>'
            : filtered.map((o) =>
                '<label style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,0.4);font-size:12px;cursor:pointer;">' +
                  '<span>' + esc(o.name) + ' <span style="color:var(--text-muted);">@' + esc(o.handle || 'member') + '</span></span>' +
                  '<input type="checkbox" class="cg-mem" value="' + esc(o.uid) + '" ' + (picked[o.uid] ? 'checked' : '') + ' />' +
                '</label>'
              ).join('');
          listEl.querySelectorAll('.cg-mem').forEach((cb) => {
            cb.onchange = () => { picked[cb.value] = cb.checked; };
          });
        }

        modalRoot.innerHTML =
          '<form id="cg-form" class="glass modal-box stack">' +
            '<h3 style="font-size:16px;font-weight:700;">নতুন গ্রুপ তৈরি করুন</h3>' +
            '<div id="cg-err" class="err-banner hidden"></div>' +
            '<input type="text" id="cg-name" class="c-input" placeholder="গ্রুপের নাম" required />' +
            '<label class="c-btn-ghost" style="cursor:pointer;">গ্রুপ লোগো (ঐচ্ছিক)<input type="file" id="cg-logo" accept="image/*" class="hidden" /></label>' +
            '<input type="text" id="cg-search" class="c-input" placeholder="মেম্বার খুঁজুন (নাম, @হ্যান্ডেল বা ইমেইল)..." />' +
            '<div id="cg-user-list" style="max-height:170px;overflow-y:auto;" class="stack"></div>' +
            '<div style="display:flex;justify-content:flex-end;gap:8px;">' +
              '<button type="button" id="close-modal-btn" class="c-btn-ghost">বাতিল</button>' +
              '<button type="submit" id="cg-submit-btn" class="c-btn">তৈরি করুন</button>' +
            '</div>' +
          '</form>';
        modalRoot.classList.remove('hidden');
        renderPickList('');
        document.getElementById('cg-search').oninput = (e) => renderPickList(e.target.value);
        document.getElementById('close-modal-btn').onclick = closeModal;
        document.getElementById('cg-form').onsubmit = async (e) => {
          e.preventDefault();
          const gname = document.getElementById('cg-name').value.trim();
          const logoFile = document.getElementById('cg-logo').files[0];
          const btn = document.getElementById('cg-submit-btn');
          const errEl = document.getElementById('cg-err');
          errEl.classList.add('hidden');
          btn.disabled = true;
          btn.innerHTML = '<span class="btn-spinner"></span><span>তৈরি হচ্ছে...</span>';
          try {
            await ensureTransport();
            const members = { [state.currentUser.uid]: true };
            Object.keys(picked).forEach((k) => { if (picked[k]) members[k] = true; });
            let logoUrl = DEFAULT_AVATAR;
            if (logoFile) logoUrl = await uploadMedia(logoFile, 'image');
            const gRef = db.ref('groups').push();
            await gRef.set({
              name: gname,
              logo: logoUrl,
              inviteCode: genInviteCode(),
              createdBy: state.currentUser.uid,
              createdAt: Date.now(),
              members: members,
              admins: { [state.currentUser.uid]: true }
            });
            closeModal();
            selectGroup(gRef.key);
          } catch (err) {
            errEl.textContent = (err && err.message) ? err.message : 'গ্রুপ তৈরি করা যায়নি।';
            errEl.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'তৈরি করুন';
          }
        };
      }

      function openGroupManageModal(noticeMsg) {
        const g = state.groups.find((x) => x.id === state.selectedGroupId);
        if (!g) return;
        const me = state.currentUser;
        const gMembers = g.members || {};
        const gAdmins = g.admins || {};
        const isAdm = Boolean(gAdmins[me.uid] || g.createdBy === me.uid || me.role === 'admin');
        const memIds = Object.keys(gMembers);
        const nonMem = Object.values(state.users).filter((u) => !gMembers[u.uid] && !u.banned);

        if (!g.inviteCode) {
          g.inviteCode = genInviteCode();
          db.ref('groups/' + g.id).update({ inviteCode: g.inviteCode }).catch(() => {});
        }

        function renderNonMemberSearch(q) {
          const term = (q || '').trim().toLowerCase();
          const filtered = nonMem.filter((nm) =>
            !term ||
            (nm.name && nm.name.toLowerCase().includes(term)) ||
            (nm.handle && nm.handle.toLowerCase().includes(term)) ||
            (nm.email && nm.email.toLowerCase().includes(term))
          );
          const wrap = document.getElementById('gm-nonmem-list');
          if (!wrap) return;
          wrap.innerHTML = filtered.length === 0
            ? '<div style="font-size:12px;color:var(--text-muted);">যুক্ত করার মতো কোনো মেম্বার পাওয়া যায়নি।</div>'
            : filtered.map((nm) =>
                '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,0.4);">' +
                  '<span>' + esc(nm.name) + ' <span style="color:var(--text-muted);">@' + esc(nm.handle || 'member') + '</span></span>' +
                  '<button type="button" class="c-btn-ghost gm-add" data-uid="' + esc(nm.uid) + '">+ অ্যাড</button>' +
                '</div>'
              ).join('');
          wrap.querySelectorAll('.gm-add').forEach((b) => {
            b.onclick = async () => {
              await ensureTransport();
              await db.ref('groups/' + g.id + '/members/' + b.dataset.uid).set(true);
              gMembers[b.dataset.uid] = true;
              openGroupManageModal('মেম্বার যুক্ত করা হয়েছে।');
            };
          });
        }

        modalRoot.innerHTML =
          '<div class="glass modal-box stack">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;"><h3 style="font-size:16px;font-weight:700;">গ্রুপ ম্যানেজমেন্ট ও ইনভাইটেশন</h3><button type="button" id="close-modal-btn" class="c-btn-ghost">✕</button></div>' +
            (noticeMsg ? '<div class="ok-banner">' + esc(noticeMsg) + '</div>' : '') +
            '<div style="padding:12px;border-radius:12px;background:rgba(0,0,0,0.5);border:1px solid rgba(220,38,38,0.3);" class="stack">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#fca5a5;">' +
                '<span>গ্রুপ ইনভাইটেশন লিংক</span>' +
                (isAdm ? '<button type="button" id="gm-regen-inv" style="font-size:11px;color:#e5d8dc;text-decoration:underline;">লিংক রিসেট</button>' : '') +
              '</div>' +
              '<div style="display:flex;gap:6px;">' +
                '<input type="text" id="gm-inv-url" readonly class="c-input" style="font-size:11px;padding:7px 10px;" value="' + esc(getGroupInviteUrl(g)) + '" />' +
                '<button type="button" id="gm-copy-inv" class="c-btn" style="padding:7px 12px;">কপি</button>' +
              '</div>' +
            '</div>' +
            (isAdm ? '<form id="gm-meta-form" class="stack"><input type="text" id="gm-name" class="c-input" value="' + esc(g.name) + '" />' +
              '<label class="c-btn-ghost" style="cursor:pointer;">নতুন গ্রুপ লোগো<input type="file" id="gm-logo" accept="image/*" class="hidden" /></label>' +
              '<button type="submit" class="c-btn">নাম ও লোগো সেভ করুন</button></form>' : '') +
            '<div style="font-size:12px;font-weight:700;">মেম্বার তালিকা (' + memIds.length + ')</div>' +
            '<div class="stack" style="gap:6px;max-height:200px;overflow-y:auto;">' + memIds.map((mid) => {
              const mu = state.users[mid] || {};
              const mIsAdm = Boolean(gAdmins[mid] || g.createdBy === mid);
              return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,0.45);border:1px solid rgba(127,29,29,0.35);font-size:12px;">' +
                '<button type="button" data-profile="' + esc(mid) + '" style="display:flex;align-items:center;gap:8px;min-width:0;text-align:left;flex:1;" title="প্রোফাইল দেখুন">' +
                  '<img src="' + esc(mu.avatar || DEFAULT_AVATAR) + '" class="avatar-xs" style="width:28px;height:28px;flex-shrink:0;" />' +
                  '<div style="min-width:0;">' +
                    '<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">' +
                      '<span style="font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(mu.name || mid) + '</span>' +
                      (mIsAdm ? '<span class="admin-tag">🛡️ অ্যাডমিন</span>' : '') +
                    '</div>' +
                    '<div style="font-size:10px;color:var(--text-muted);">@' + esc(mu.handle || 'member') + ' · প্রোফাইল দেখুন</div>' +
                  '</div>' +
                '</button>' +
                (isAdm && mid !== me.uid ? '<div style="display:flex;gap:4px;flex-shrink:0;">' +
                  '<button type="button" class="c-btn-ghost gm-tadm" style="padding:5px 8px;font-size:11px;" data-uid="' + esc(mid) + '">' + (mIsAdm ? 'অ্যাডমিন সরান' : 'অ্যাডমিন করুন') + '</button>' +
                  '<button type="button" class="c-btn-ghost gm-rem" style="padding:5px 8px;font-size:11px;border-color:rgba(239,68,68,0.45);color:#fca5a5;" data-uid="' + esc(mid) + '">রিমুভ</button></div>' : '') +
              '</div>';
            }).join('') + '</div>' +
            (isAdm ? '<div style="font-size:12px;font-weight:700;padding-top:6px;border-top:1px solid rgba(127,29,29,0.4);">মেম্বার সার্চ করে অ্যাড করুন</div>' +
              '<input type="text" id="gm-search" class="c-input" placeholder="নাম, @হ্যান্ডেল বা ইমেইল লিখে খুঁজুন..." />' +
              '<div id="gm-nonmem-list" class="stack" style="gap:6px;max-height:150px;overflow-y:auto;"></div>' : '') +
            '<div style="display:flex;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid rgba(127,29,29,0.4);">' +
              '<button type="button" id="gm-leave" class="c-btn-ghost">গ্রুপ লিভ নিন</button>' +
              (isAdm ? '<button type="button" id="gm-delete" class="c-btn">গ্রুপ ডিলিট করুন</button>' : '') +
            '</div>' +
          '</div>';
        modalRoot.classList.remove('hidden');
        document.getElementById('close-modal-btn').onclick = closeModal;
        if (isAdm) {
          renderNonMemberSearch('');
          const gmSearch = document.getElementById('gm-search');
          if (gmSearch) gmSearch.oninput = (e) => renderNonMemberSearch(e.target.value);
        }
        const copyBtn = document.getElementById('gm-copy-inv');
        if (copyBtn) copyBtn.onclick = async () => {
          await copyTextSafe(getGroupInviteUrl(g));
          copyBtn.textContent = 'কপি হয়েছে';
          setTimeout(() => { copyBtn.textContent = 'কপি'; }, 2000);
        };
        const regenBtn = document.getElementById('gm-regen-inv');
        if (regenBtn) regenBtn.onclick = async () => {
          const nc = genInviteCode();
          g.inviteCode = nc;
          await db.ref('groups/' + g.id).update({ inviteCode: nc });
          openGroupManageModal('নতুন ইনভাইটেশন লিংক তৈরি করা হয়েছে।');
        };
        const metaForm = document.getElementById('gm-meta-form');
        if (metaForm) metaForm.onsubmit = async (e) => {
          e.preventDefault();
          const upd = { name: document.getElementById('gm-name').value.trim() };
          const lf = document.getElementById('gm-logo').files[0];
          if (lf) upd.logo = await uploadMedia(lf, 'image');
          await db.ref('groups/' + g.id).update(upd);
          closeModal();
        };
        modalRoot.querySelectorAll('.gm-rem').forEach((b) => {
          b.onclick = async () => {
            await db.ref('groups/' + g.id + '/members/' + b.dataset.uid).remove();
            await db.ref('groups/' + g.id + '/admins/' + b.dataset.uid).remove();
            delete gMembers[b.dataset.uid];
            delete gAdmins[b.dataset.uid];
            openGroupManageModal('মেম্বার রিমুভ করা হয়েছে।');
          };
        });
        modalRoot.querySelectorAll('.gm-tadm').forEach((b) => {
          b.onclick = async () => {
            const uid = b.dataset.uid;
            const cur = Boolean(gAdmins[uid]);
            if (cur) { await db.ref('groups/' + g.id + '/admins/' + uid).remove(); delete gAdmins[uid]; }
            else { await db.ref('groups/' + g.id + '/admins/' + uid).set(true); gAdmins[uid] = true; }
            openGroupManageModal(cur ? 'অ্যাডমিন থেকে সরানো হয়েছে।' : 'নতুন অ্যাডমিন যুক্ত করা হয়েছে।');
          };
        });
        document.getElementById('gm-leave').onclick = async () => {
          await db.ref('groups/' + g.id + '/members/' + me.uid).remove();
          await db.ref('groups/' + g.id + '/admins/' + me.uid).remove();
          state.selectedGroupId = null;
          closeModal();
          renderAll();
        };
        const delBtn = document.getElementById('gm-delete');
        if (delBtn) delBtn.onclick = async () => {
          await db.ref('groups/' + g.id).remove();
          await db.ref('group_messages/' + g.id).remove();
          await db.ref('group_typing/' + g.id).remove();
          await db.ref('group_seen/' + g.id).remove();
          state.selectedGroupId = null;
          closeModal();
          renderAll();
        };
      }

      // =========================================================================
      // 8. SESSION BOOTSTRAP (Runs after all handlers & variables are initialized)
      // =========================================================================
      (function initSession() {
        const cached = readCachedProfile();
        const savedTab = readActiveTab();
        if (cached) {
          enterApp(cached, savedTab);
        }

        async function syncSessionFromVault(fallbackUid) {
          const savedUid = readSession() || fallbackUid;
          if (!savedUid) return;
          try {
            await ensureTransport();
            const snap = await withTimeout(db.ref('users/' + savedUid).once('value'), 10000);
            if (snap.exists()) {
              const p = snap.val();
              if (p.banned) {
                logout();
              } else {
                const full = { ...p, uid: p.uid || savedUid };
                if (!state.currentUser) {
                  enterApp(full, readActiveTab());
                } else {
                  state.currentUser = full;
                  saveSession(full.uid, full);
                  bindStreams(false);
                  scheduleRender();
                }
              }
            }
          } catch (e) {
            // Keep cached session intact even if network is slow or temporarily offline
          }
        }

        auth.onAuthStateChanged((fbUser) => {
          if (fbUser && fbUser.uid) {
            if (state.currentUser && boundTransportUid !== fbUser.uid) {
              bindStreams(true);
            }
            syncSessionFromVault(fbUser.uid);
          }
        });
        syncSessionFromVault();
      })();
    })();
  </script>
</body>
</html>
